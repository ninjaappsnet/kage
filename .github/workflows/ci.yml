name: ci

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    # Shared with main.yml's macOS jobs: the self-hosted runners are all on one
    # machine and share ~/.local/share/mise, which corrupts under concurrent
    # installs. cancel-in-progress stays false so a PR can never cancel a release
    # build that already holds the group.
    concurrency:
      group: macos-runner
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      MISE_HTTP_TIMEOUT: 120
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-macos
      - parallel:
          - run: make lint
          - run: make inspect-dependencies
      - run: make build-app
        env:
          XCODEBUILD_FLAGS: -showBuildTimingSummary
      - run: make test
